<script>
'use strict';
const D=__DATA__;
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const COLORS={BH:'var(--clinic-bh)',POA:'var(--clinic-poa)',CAMPINAS:'var(--clinic-campinas)',CURITIBA:'var(--clinic-curitiba)'};
const LEGACY=['JEAN','VILMAR','KELVER','HENRIQUE','LEANDRO','DIEGO','RAUL','LUCAS','JOSEPH','PEDRO','EMANUEL'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>Number(x).toLocaleString('pt-BR'),pct=(a,b)=>b?((a/b)*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'n.d.',variation=(a,b)=>b?((a-b)/b*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1,signDisplay:'exceptZero'})+'%':'n.d.';
const rows=D.rows.map(r=>Object.assign({date:r[0],clinic:r[1],staff:r[2],year:+r[0].slice(0,4),month:+r[0].slice(5,7),day:+r[0].slice(8,10)},Object.fromEntries(D.fields.map((f,i)=>[f,r[i+3]]))));
let view='overview';
function total(rs){return rs.reduce((a,r)=>(D.fields.forEach(f=>a[f]+=r[f]),a),Object.fromEntries(D.fields.map(f=>[f,0])))}
function group(rs,key){return [...new Set(rs.map(r=>r[key]))].map(name=>({name,...total(rs.filter(r=>r[key]===name))})).sort((a,b)=>(b.compareceu/(b.leads||1)-a.compareceu/(a.leads||1))||b.leads-a.leads||a.name.localeCompare(b.name));}
function source(y){return D.sources.find(s=>s.arquivo.includes(y))}
function cutoff(y,m){const end=source(y).fim;return end.slice(5,7)==String(m).padStart(2,'0')?+end.slice(8,10):new Date(y,m,0).getDate()}
function ranking(rs,key,cot=false){let g=group(rs,key);if(cot)g.sort((a,b)=>(b.comp_cot/(b.cotaveis||1)-a.comp_cot/(a.cotaveis||1))||b.cotaveis-a.cotaveis||a.name.localeCompare(b.name));return table(cot?['Posição / '+(key==='clinic'?'Clínica':'Atendente'),'Leads','Cotáveis','Não cotáveis','Verificar','% cotáveis','Agend. cot.','% agend. cot.','Comp. cot.','Conversão cot.','% presença / agend. cot.']:['Posição / '+(key==='clinic'?'Clínica':'Atendente'),'Leads','Agendados','% agend.','Compareceram','Conversão final','% presença / agendados'],g.map((r,i)=>cot?[`${i+1}. ${r.name}`,n(r.leads),n(r.cotaveis),n(r.nao_cotaveis),n(r.verificar),pct(r.cotaveis,r.leads),n(r.ag_cot),pct(r.ag_cot,r.cotaveis),n(r.comp_cot),pct(r.comp_cot,r.cotaveis),pct(r.comp_cot,r.ag_cot)]:[`${i+1}. ${r.name}`,n(r.leads),n(r.agendados),pct(r.agendados,r.leads),n(r.compareceu),pct(r.compareceu,r.leads),pct(r.compareceu,r.agendados)]));}
function note(t,extra=''){return '<div class="note '+extra+'">'+t+'</div>'}
function assess(t,name){return `<b>${esc(name)}</b> registrou ${n(t.leads)} contatos, ${n(t.agendados)} agendamentos (${pct(t.agendados,t.leads)}) e ${n(t.compareceu)} comparecimentos (${pct(t.compareceu,t.leads)} dos leads). Entre os cotáveis, ${n(t.comp_cot)} comparecimentos em ${n(t.cotaveis)} contatos resultam em ${pct(t.comp_cot,t.cotaveis)} de conversão. A presença foi de ${pct(t.compareceu,t.agendados)} dos agendados. Cancelamentos: ${n(t.cancelou)} (${pct(t.cancelou,t.agendados)}); faltas: ${n(t.faltou)} (${pct(t.faltou,t.agendados)}).`}
function method(){return `<div class="panel"><div class="eyebrow">Critérios de leitura</div><h2>Método, fontes e conferência</h2><p class="sub">Os dados abaixo descrevem os arquivos completos, independentemente dos filtros de análise.</p><div class="checks"><div><h3>Definições preservadas</h3><p class="sub">Um lead equivale a uma linha de contato com REF única no arquivo. Internet e offline estão incluídos. Período determinado pela DATA DO CONTATO; os desfechos pertencem à coorte de contatos, não à data da consulta. Agendados usam SITUAÇÃO = AGENDADO. Compareceram usam CONCLUSÃO = COMPARECEU dentro dos agendados.</p><p class="sub">Taxa de agendamento = agendados / leads. Conversão final = comparecimentos / leads. Presença = comparecimentos / agendados. Nos cotáveis, numerador e denominador recebem o mesmo filtro. Taxas acumuladas são calculadas com os totais, sem média simples de percentuais. Divisor zero: n.d.</p></div><div><h3>Períodos e comparação</h3><p class="sub">O último mês usa a maior DATA DO CONTATO disponível. Isso indica cobertura observada e não comprova fechamento do mês. Quando parcial, a comparação com o ano anterior termina no mesmo dia. Meses anteriores são tratados como completos na análise, sujeitos à cobertura da planilha. Não há base de 2024.</p><p class="sub">Rankings usam conversão final decrescente, depois volume da base relevante e nome. A equipe histórica de 11 nomes é um filtro de referência; não comprova quem está ativo hoje. O filtro inicial de volume exibe atendentes com leads na média ou acima da média da seleção. A média usa atendentes nomeados no período, clínica e escopo. Os demais permanecem disponíveis em Mostrar todos os volumes, sem alterar os totais da rede.</p></div></div><h3>Arquivos e totais de controle</h3>${table(['Arquivo','Registros','Primeiro contato','Último contato'],D.sources.map(s=>[s.arquivo,n(s.linhas),s.inicio,s.fim]))}${table(['Ano','Leads','REF únicas','Agendados','Compareceu','Cancelou','Faltou','Devolução','Aguardando'],D.checks.map(t=>[t.ano,n(t.leads),n(t.refs_unicas),n(t.agendados),n(t.compareceu),n(t.cancelou),n(t.faltou),n(t.devolucao),n(t.aguardando)]))}<h3>Ocorrências para revisão da base</h3>${note(D.issues.length?`${n(D.issues.length)} ocorrências identificadas nos arquivos completos. Qualificações pendentes e atendentes ausentes são preservados; desfechos incompatíveis com NÃO AGENDADO ficam fora da agenda. O gerador não altera registros nas planilhas.`:'Nenhuma ocorrência identificada pelos critérios automáticos de qualificação pendente, atendente ausente ou desfecho incompatível. Os totais e as referências são conferidos na geração.',D.issues.length?'warning':'')}${table(['Arquivo','Clínica','Linha Excel','REF','Ocorrência'],D.issues.map(x=>[x.arquivo,x.clinica,x.linha,x.ref,x.motivo]),'audit')}<h3>Relatórios anteriores e pareceres</h3><p class="sub">Os relatórios anteriores, com corte em julho de 2026, foram preservados integralmente no acervo abaixo. Seus pareceres são históricos. As análises desta página são recalculadas a partir das planilhas atuais e descrevem os indicadores, sem atribuir causas não demonstradas.</p><p><a href="historico.html" target="_blank" rel="noopener">Consultar os 35 relatórios de página e pareceres originais</a></p>${note('Correções de interpretação: o parecer geral de atendentes chamava Henrique de líder, embora a tabela colocasse Kelver em primeiro. O texto de POA informava 15,1%, mas 829 / 5.549 equivale a 14,9%. Alguns pareceres individuais de cotáveis usavam comparecimentos gerais, divergindo da tabela filtrada. O novo relatório aplica o filtro cotável tanto ao numerador quanto ao denominador.','warning')}<p><a href="verificacao/comparacao_historica.html" target="_blank" rel="noopener">Ver reconciliação das tabelas históricas com as planilhas atuais</a></p><h3>Atualização</h3><p class="sub">Atualize e salve apenas Base de Dados/dados 2025.xlsx e Base de Dados/dados 2026.xlsx. Execute ATUALIZAR_RELATORIO.cmd e recarregue este HTML. O gerador interrompe a atualização se houver REF duplicada, ano incompatível, colunas ou categorias desconhecidas. O arquivo de contatos do Power BI não é lido. A auditoria registra as assinaturas SHA-256 das duas fontes.</p><p><a href="LEIA-ME.md">Instruções completas de atualização</a></p></div>`;}
// Recursos de apresentação incorporados.
const PdfDocs=__PDF_DOCS__;
__UI_SCRIPT__
__REFINEMENT_SCRIPT__
$('#clinic').innerHTML+=[...new Set(rows.map(r=>r.clinic))].sort().map(c=>`<option>${esc(c)}</option>`).join('');setMonths();$('#year').addEventListener('change',()=>{setMonths();draw()});$('#clinic').addEventListener('change',draw);document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
const printNames={overview:'Visão da rede',clinics:'Por clínica',staff:'Por atendente',method:'Método e conferência'};
let printDetails=[],printScope='selected',printPrepared=false;
function preparePrint(){if(printPrepared)return;printPrepared=true;document.documentElement.dataset.printScope=printScope;Object.entries(printNames).forEach(([id,name])=>{$('#'+id).setAttribute('data-print-title',name);$('#'+id).setAttribute('data-print-selected',String(id===view))});printDetails=[...document.querySelectorAll(printScope==='all'?'main section details':'#'+view+' details')].map(d=>[d,d.open]);printDetails.forEach(([d])=>d.open=true);if(printScope==='all'||view==='overview')document.querySelectorAll('.chart-host').forEach(renderTrend);}
function restorePrint(){printDetails.forEach(([d,open])=>d.open=open);printDetails=[];printPrepared=false;delete document.documentElement.dataset.printScope;printScope='selected';}
function closePrintDialog(){$('#printDialog').close();$('#print').focus();}
function printReport(scope){printScope=scope;closePrintDialog();preparePrint();window.print();}
window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',restorePrint);
$('#print').addEventListener('click',()=>{$('#printTabName').textContent=printNames[view];$('#printDialog').showModal()});
$('#printClose').addEventListener('click',closePrintDialog);$('#printCancel').addEventListener('click',closePrintDialog);
$('#printAll').addEventListener('click',()=>printReport('all'));$('#printSelected').addEventListener('click',()=>printReport('selected'));
$('#printDialog').addEventListener('click',event=>{if(event.target!==$('#printDialog'))return;const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closePrintDialog()});
draw();
</script></body></html>
